
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - node_modules:/app/node_modules
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./pages
          target: /app/pages
        - action: sync
          path: ./next.config.js
          target: /app/next.config.js
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./eslint.config.js
          target: /app/eslint.config.js
        - action: sync
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./yarn.lock

volumes:
  node_modules:
